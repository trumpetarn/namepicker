<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Namnväljare – Jakob Markgren</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
    }

    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 300;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea::placeholder {
      color: #555;
    }

    textarea:focus {
      border-color: #666;
    }

    button {
      background: #fff;
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #ddd;
    }

    button:disabled {
      background: #333;
      color: #666;
      cursor: default;
    }

    #result {
      text-align: center;
      min-height: 5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #result span {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #fff;
      opacity: 0;
      transition: opacity 0.25s;
    }

    #result span.visible {
      opacity: 1;
    }

    #result span.spinning {
      opacity: 1;
      color: #666;
    }

    #result span.landing {
      opacity: 1;
      color: #fff;
    }

    #history {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    #history h2 {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
    }

    #history ol {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    #history li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      font-weight: 300;
      color: #aaa;
    }

    #history li .rank {
      font-size: 0.7rem;
      color: #444;
      width: 1rem;
      text-align: right;
      flex-shrink: 0;
    }

    #history li .hist-name {
      flex: 1;
    }

    #history li .hist-date {
      font-size: 0.75rem;
      color: #555;
      flex-shrink: 0;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <main>
    <h1>Namnväljare</h1>
    <textarea id="names" placeholder="Skriv ett namn per rad&#10;&#10;Anna&#10;Bo&#10;Cecilia&#10;David"></textarea>
    <button id="pick-btn" onclick="pickName()">Välj ett namn</button>
    <div id="result"><span id="chosen"></span></div>
    <div id="history" style="display:none">
      <h2>Historik</h2>
      <ol id="history-list"></ol>
    </div>
  </main>
  <script>
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff9f1c', '#e040fb', '#00bcd4', '#ffffff'];
      const particles = Array.from({ length: 160 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height * 0.6,
        w: Math.random() * 10 + 5,
        h: Math.random() * 5 + 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.15,
        vx: (Math.random() - 0.5) * 4,
        vy: Math.random() * 3 + 2,
      }));

      let animId;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.06;
          p.rot += p.rotSpeed;
          if (p.y < canvas.height + 20) alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (alive) {
          animId = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(animate);
    }

    function playFanfare() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const actx = new AudioCtx();

      function note(freq, startOffset, duration, vol = 0.28) {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const t = actx.currentTime + startOffset;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.02);
        gain.gain.linearRampToValueAtTime(0, t + duration);
        osc.start(t);
        osc.stop(t + duration + 0.05);
      }

      // Ascending arpeggio C5–E5–G5, then triumphant chord C5+E5+G5+C6
      note(523.25, 0,    0.13);          // C5
      note(659.25, 0.12, 0.13);          // E5
      note(783.99, 0.24, 0.13);          // G5
      note(523.25, 0.36, 0.55, 0.18);   // C5 chord
      note(659.25, 0.36, 0.55, 0.18);   // E5 chord
      note(783.99, 0.36, 0.55, 0.18);   // G5 chord
      note(1046.50, 0.36, 0.55, 0.18);  // C6 chord
    }

    let spinning = false;

    const HISTORY_KEY = 'namepicker-history';
    const MAX_HISTORY = 25;

    function loadHistory() {
      try {
        const raw = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        return raw.map(entry =>
          typeof entry === 'string' ? { name: entry, date: null } : entry
        );
      } catch { return []; }
    }

    function saveHistory(history) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function formatHistDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderHistory() {
      const history = loadHistory();
      const section = document.getElementById('history');
      const list = document.getElementById('history-list');
      if (history.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'flex';
      list.innerHTML = history.map((entry, i) =>
        `<li><span class="rank">${i + 1}</span><span class="hist-name">${entry.name}</span>${entry.date ? `<span class="hist-date">${formatHistDate(entry.date)}</span>` : ''}</li>`
      ).join('');
    }

    function addToHistory(name) {
      const history = loadHistory();
      history.unshift({ name, date: new Date().toISOString() });
      saveHistory(history.slice(0, MAX_HISTORY));
      renderHistory();
    }

    function pickName() {
      if (spinning) return;
      const raw = document.getElementById('names').value;
      const names = raw.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      if (names.length === 0) return;

      const winner = names[Math.floor(Math.random() * names.length)];
      const btn = document.getElementById('pick-btn');
      const chosen = document.getElementById('chosen');

      spinning = true;
      btn.disabled = true;

      const totalSteps = 20;
      const baseDuration = 60;
      let step = 0;

      chosen.className = 'spinning';
      chosen.textContent = names[Math.floor(Math.random() * names.length)];

      function nextStep() {
        step++;
        const delay = step < totalSteps / 2
          ? baseDuration
          : baseDuration + Math.pow(step - totalSteps / 2, 2) * 8;

        if (step < totalSteps) {
          chosen.textContent = names[Math.floor(Math.random() * names.length)];
          setTimeout(nextStep, delay);
        } else {
          chosen.textContent = winner;
          chosen.className = 'landing visible';
          spinning = false;
          btn.disabled = false;
          addToHistory(winner);
          launchConfetti();
          playFanfare();
        }
      }

      setTimeout(nextStep, baseDuration);
    }

    const textarea = document.getElementById('names');

    textarea.value = localStorage.getItem('namepicker-names') || '';

    textarea.addEventListener('input', function () {
      localStorage.setItem('namepicker-names', this.value);
      const names = this.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      document.getElementById('pick-btn').disabled = names.length === 0 || spinning;
    });

    const initialNames = textarea.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
    document.getElementById('pick-btn').disabled = initialNames.length === 0;

    renderHistory();
  </script>
</body>
</html>
