<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Namnväljare – Jakob Markgren</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
    }

    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 300;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea::placeholder {
      color: #555;
    }

    textarea:focus {
      border-color: #666;
    }

    button {
      background: #fff;
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #ddd;
    }

    button:disabled {
      background: #333;
      color: #666;
      cursor: default;
    }

    #result {
      text-align: center;
      min-height: 5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #result span {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #fff;
      opacity: 0;
      transition: opacity 0.25s;
    }

    #result span.visible {
      opacity: 1;
    }

    #result span.spinning {
      opacity: 1;
      color: #666;
    }

    #result span.landing {
      opacity: 1;
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Namnväljare</h1>
    <textarea id="names" placeholder="Skriv ett namn per rad&#10;&#10;Anna&#10;Bo&#10;Cecilia&#10;David"></textarea>
    <button id="pick-btn" onclick="pickName()">Välj ett namn</button>
    <div id="result"><span id="chosen"></span></div>
  </main>
  <script>
    let spinning = false;

    function pickName() {
      if (spinning) return;
      const raw = document.getElementById('names').value;
      const names = raw.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      if (names.length === 0) return;

      const winner = names[Math.floor(Math.random() * names.length)];
      const btn = document.getElementById('pick-btn');
      const chosen = document.getElementById('chosen');

      spinning = true;
      btn.disabled = true;

      const totalSteps = 20;
      const baseDuration = 60; // ms per step at start
      let step = 0;

      chosen.className = 'spinning';
      chosen.textContent = names[Math.floor(Math.random() * names.length)];

      function nextStep() {
        step++;
        // Ease out: each step gets a bit slower after halfway
        const delay = step < totalSteps / 2
          ? baseDuration
          : baseDuration + Math.pow(step - totalSteps / 2, 2) * 8;

        if (step < totalSteps) {
          chosen.textContent = names[Math.floor(Math.random() * names.length)];
          setTimeout(nextStep, delay);
        } else {
          chosen.textContent = winner;
          chosen.className = 'landing visible';
          spinning = false;
          btn.disabled = false;
        }
      }

      setTimeout(nextStep, baseDuration);
    }

    const textarea = document.getElementById('names');

    textarea.value = localStorage.getItem('namepicker-names') || '';

    textarea.addEventListener('input', function () {
      localStorage.setItem('namepicker-names', this.value);
      const names = this.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
      document.getElementById('pick-btn').disabled = names.length === 0 || spinning;
    });

    const initialNames = textarea.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
    document.getElementById('pick-btn').disabled = initialNames.length === 0;
  </script>
</body>
</html>
