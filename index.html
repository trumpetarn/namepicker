<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <script>
    // Apply the saved colour mode before anything renders (theme.js handles switching).
    try {
      const t = localStorage.getItem('namepicker-theme');
      if (['light', 'clown'].includes(t)) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Site menu: the same block is inlined on every page. */
    .site-menu {
      position: absolute;
      top: 0.6rem;
      left: 1rem;
      z-index: 50;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 300;
    }

    .site-menu summary {
      list-style: none;
      cursor: pointer;
      color: #999;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .site-menu summary::-webkit-details-marker { display: none; }

    .site-menu summary::after {
      content: " +";
    }

    .site-menu[open] summary::after {
      content: " \2212";
    }

    .site-menu summary:hover,
    .site-menu[open] summary {
      color: #fff;
    }

    .site-menu ul {
      list-style: none;
      margin: 0.5rem 0 0 -0.75rem;
      padding: 0.5rem 0.75rem;
      background: #111;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .site-menu a {
      color: #999;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .site-menu a:hover,
    .site-menu a[aria-current="page"] {
      color: #fff;
    }
  </style>
  <title>Namnväljare – Jakob Markgren</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="stylesheet" href="namepicker.css?v=20261012.9">
</head>
<body>
  <details class="site-menu">
    <summary>Meny</summary>
    <ul>
      <li><a href="/">Start</a></li>
      <li><a href="/namepicker/" aria-current="page">Namnväljare</a></li>
      <li><a href="/dashboard/">Dashboard</a></li>
      <li><a href="/clock/">Klocka</a></li>
      <li><a href="/weather/">Väder</a></li>
    </ul>
  </details>
  <script>
    // Close the site menu on a click outside it or on Escape.
    {
      const siteMenu = document.querySelector('.site-menu');
      document.addEventListener('click', (e) => {
        if (siteMenu.open && !siteMenu.contains(e.target)) siteMenu.open = false;
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && siteMenu.open) {
          siteMenu.open = false;
          siteMenu.querySelector('summary').focus();
        }
      });
    }
  </script>
  <canvas id="confetti-canvas"></canvas>
  <div id="theme-switch" role="group" aria-label="Färgläge">
    <button type="button" data-theme="dark">Mörkt</button>
    <button type="button" data-theme="light">Ljust</button>
    <button type="button" data-theme="clown">Clown</button>
  </div>
  <div id="spotlight" hidden aria-hidden="true"><span id="spotlight-name"></span></div>
  <main>
    <h1>Namnväljare</h1>
    <div id="group-bar">
      <div id="group-tabs" role="tablist" aria-label="Grupper"></div>
      <div id="group-actions">
        <button type="button" id="toggle-names" aria-controls="names">Dölj namn</button>
        <button type="button" id="rename-group">Byt namn</button>
        <button type="button" id="delete-group">Ta bort</button>
        <button type="button" id="share-group">Dela</button>
        <button type="button" id="method-settings-btn" aria-expanded="false" aria-controls="method-settings">Metoder</button>
      </div>
      <fieldset id="method-settings" hidden>
        <legend>Metoder i <span id="method-group-name"></span></legend>
        <div id="method-list"></div>
      </fieldset>
    </div>
    <textarea id="names" placeholder="Skriv ett namn per rad&#10;&#10;Anna&#10;Bo&#10;Cecilia&#10;David"></textarea>
    <div id="mode-switch" role="group" aria-label="Dragningsläge">
      <button type="button" data-mode="wheel">Lyckohjulet</button>
      <button type="button" data-mode="hat">Hatten</button>
      <button type="button" data-mode="slot">Enarmade banditen</button>
      <button type="button" data-mode="remote">Fjärr&shy;kontrollen</button>
      <button type="button" id="shuffle-mode" title="Slumpa vilken metod som används">Slumpa</button>
    </div>
    <div id="stage">
      <div class="stage-panel" id="wheel-stage">
        <div id="wheel-wrap">
          <div id="wheel-pointer"></div>
          <canvas id="wheel" role="button" tabindex="0" aria-label="Snurra hjulet"></canvas>
        </div>
      </div>
      <div class="stage-panel" id="remote-stage">
        <div id="remote-wrap">
          <canvas id="remote" role="button" tabindex="0" aria-label="Snurra fjärrkontrollen"></canvas>
        </div>
      </div>
      <div class="stage-panel" id="hat-stage">
        <div id="hat-scene">
          <div id="hat-note"><span></span></div>
          <div id="hat-slips"></div>
          <svg id="hat" viewBox="0 0 200 170" role="button" tabindex="0" aria-label="Dra en lapp">
            <path d="M40 40 L50 150 Q100 168 150 150 L160 40 Z" fill="#222" stroke="#444" stroke-width="2"/>
            <path d="M41.6 58 L158.4 58 L156.8 76 L43.2 76 Z" fill="#b3261e"/>
            <ellipse cx="100" cy="40" rx="92" ry="16" fill="#2a2a2a" stroke="#555" stroke-width="2"/>
            <ellipse cx="100" cy="40" rx="60" ry="9" fill="#050505"/>
          </svg>
        </div>
      </div>
      <div class="stage-panel" id="slot-stage">
        <div id="slot-machine">
          <div id="reel-box">
            <div id="reel-window"><div id="reel"></div></div>
            <div id="reel-frame"></div>
          </div>
          <button type="button" id="lever" aria-label="Dra i spaken">
            <span id="lever-mount"></span>
            <span id="lever-arm"></span>
            <span id="lever-knob"></span>
          </button>
        </div>
      </div>
    </div>
    <button id="pick-btn" onclick="pickName()">Välj ett namn</button>
    <div id="result" role="status"><span id="chosen"></span></div>
    <div id="history" style="display:none">
      <div id="history-head">
        <h2>Historik</h2>
        <button type="button" id="export-history">Exportera CSV</button>
      </div>
      <ol id="history-list"></ol>
    </div>
  </main>
  <script src="random.js?v=20261012.9"></script>
  <script src="theme.js?v=20261012.9"></script>
  <script src="effects.js?v=20261012.9"></script>
  <script src="groups.js?v=20261012.9"></script>
  <script src="history.js?v=20261012.9"></script>
  <script src="share.js?v=20261012.9"></script>
  <script src="wheel.js?v=20261012.9"></script>
  <script src="hat.js?v=20261012.9"></script>
  <script src="slot.js?v=20261012.9"></script>
  <script src="remote.js?v=20261012.9"></script>
  <script src="app.js?v=20261012.9"></script>

</body>
</html>
